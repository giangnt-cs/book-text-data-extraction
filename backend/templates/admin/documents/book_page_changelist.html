{% extends "admin/change_list.html" %}

{% block content %}
{% if book_change_url %}
<div class="mb-4 flex flex-wrap items-center gap-3">
  <a
    href="{{ book_change_url }}"
    class="inline-flex items-center rounded-default border border-base-300 px-3 py-1.5 text-sm font-medium hover:bg-base-50 dark:border-base-700 dark:hover:bg-base-800"
  >
    ← Về sách
  </a>
  {% if book_scope %}
  <span class="text-sm text-base-500 dark:text-base-400">{{ book_scope.title }}</span>
  {% endif %}
</div>
{% endif %}
{{ block.super }}
{% endblock %}
