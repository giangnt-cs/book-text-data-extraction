<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ title }}</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; background: #f8fafc; color: #0f172a; }
    .wrap { max-width: 28rem; margin: 4rem auto; padding: 0 1rem; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 1.5rem; }
    h1 { font-size: 1.15rem; margin: 0 0 0.35rem; }
    p { font-size: 0.875rem; color: #475569; margin: 0 0 1rem; }
    label { display: block; font-size: 0.8125rem; font-weight: 600; margin: 0 0 0.3rem; }
    input { width: 100%; box-sizing: border-box; padding: 0.5rem 0.65rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9375rem; margin-bottom: 0.85rem; }
    button { width: 100%; border: none; border-radius: 8px; padding: 0.6rem 1rem; background: #0f766e; color: #fff; font-weight: 700; cursor: pointer; }
    .err { color: #b91c1c; font-size: 0.8125rem; margin: 0 0 0.75rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Tài liệu được chia sẻ</h1>
      <p>Nhập họ tên, email và mật khẩu được gửi kèm liên kết.</p>
      {% if error %}<p class="err">{{ error }}</p>{% endif %}
      <form method="post" action="">
        {% csrf_token %}
        <label for="id_name">Họ tên</label>
        <input id="id_name" name="name" type="text" required minlength="2" maxlength="120" autocomplete="name" value="{{ form.name.value|default:'' }}">
        <label for="id_email">Email</label>
        <input id="id_email" name="email" type="email" required maxlength="254" autocomplete="email" value="{{ form.email.value|default:'' }}">
        <label for="id_password">Mật khẩu</label>
        <input id="id_password" name="password" type="password" required maxlength="64" autocomplete="current-password">
        <button type="submit">Xác nhận</button>
      </form>
    </div>
  </div>
</body>
</html>
