<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ title }}</title>
  <style>
    body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; background: #f8fafc; color: #0f172a; }
    .wrap { max-width: 28rem; margin: 5rem auto; padding: 0 1rem; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 1.5rem; }
    h1 { font-size: 1.1rem; margin: 0 0 0.5rem; }
    p { font-size: 0.875rem; color: #475569; margin: 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Không mở được liên kết</h1>
      <p>{{ message }}</p>
    </div>
  </div>
</body>
</html>
